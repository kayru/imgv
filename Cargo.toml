[package]
name = "imgv"
version = "0.1.3"
authors = ["Yuriy O'Donnell <yuriyo@gmail.com>"]
edition = "2018"

[profile.dev.package.'*']
opt-level = 3
debug = true

[profile.dev]
incremental = false

[dependencies]
winapi = { version = "0.3.9", features = [
    "combaseapi",
    "consoleapi",
    "d3d11", 
    "d3d11sdklayers", 
    "debugapi",
    "dxgi1_2",
    "dxgi1_3",
    "errhandlingapi",
    "handleapi",
    "libloaderapi",
    "processenv",
    "synchapi",
    "shellapi",
    "shellscalingapi",
    "wincon",
    "windowsx", 
    "winerror", 
    "winuser",
    ]}

anyhow = "1.0.105"
ddsfile = "0.6"
display-info = "0.5.10"
env_logger = "0.11.12"
icc-profile = "0.1.1"
image = "0.25.10"
cgmath = { version="0.18", features = []}
com_ptr = "0.2.1"
nom-exif = "3.8.0"
log = "0.4.35"
profiling = { version = "1.0.18", features = ["profile-with-superluminal"] }
clipboard-win = "5.4.3"
widestring = "1.2.1"
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winres = "0.1.12"
ico = "0.6.0"

[features]
profile-with-superluminal = ["profiling/profile-with-superluminal"]
default = ["profile-with-superluminal"]
